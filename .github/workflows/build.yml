    - name: Build Lua with optimizations
      run: |
        cd lua-5.1.4
        # 修改 Makefile 添加优化选项
        sed -i 's/CFLAGS= -O2 -Wall $(MYCFLAGS)/CFLAGS= -O3 -march=x86-64 -mtune=generic -fomit-frame-pointer -ffast-math -Wall $(MYCFLAGS)/' src/Makefile
        # 编译
        cd src
        make linux
        
    - name: Create release directory
      run: |
        mkdir -p lua-5.1.4-linux-x64
        cp lua-5.1.4/src/lua lua-5.1.4-linux-x64/
        cp lua-5.1.4/src/luac lua-5.1.4-linux-x64/
        cp lua-5.1.4/src/liblua.a lua-5.1.4-linux-x64/
        cp lua-5.1.4/README lua-5.1.4-linux-x64/
        cp lua-5.1.4/COPYRIGHT lua-5.1.4-linux-x64/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lua-5.1.4-linux-x64
        path: lua-5.1.4-linux-x64/
        
  create-release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          lua-5.1.4-windows-x64/**
          lua-5.1.4-linux-x64/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
