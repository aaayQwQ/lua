name: Build Lua 5.1.4 (All Platforms, Pure Static, Optimized)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Lua 5.1.4
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.1.4.tar.gz -o lua.tar.gz
          tar -xzf lua.tar.gz

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: |
            mingw-w64-i686-gcc
            mingw-w64-i686-binutils
            make

      - name: Build 32-bit (Win98~Win11, Optimized)
        shell: msys2 {0}
        run: |
          cd lua-5.1.4/src
          gcc -O2 -march=i586 -mtune=generic -static -DNDEBUG -DLUA_CORE -fomit-frame-pointer -fno-stack-protector -c l*.c
          ar rcs liblua32.a l*.o
          gcc -O2 -static -s -o lua32.exe lua.o -L. -llua32
          gcc -O2 -static -s -o luac32.exe luac.o -L. -llua32
          mv liblua32.a ../
          mv lua32.exe ../
          mv luac32.exe ../
          rm -f *.o

      - name: Build 64-bit (Win7~Win11, Optimized)
        shell: msys2 {0}
        run: |
          cd lua-5.1.4/src
          gcc -O2 -static -DNDEBUG -DLUA_CORE -fomit-frame-pointer -fno-stack-protector -c l*.c
          ar rcs liblua64.a l*.o
          gcc -O2 -static -s -o lua64.exe lua.o -L. -llua64
          gcc -O2 -static -s -o luac64.exe luac.o -L. -llua64
          mv liblua64.a ../
          mv lua64.exe ../
          mv luac64.exe ../

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lua-5.1.4-all-platforms-pure-static
          path: |
            lua-5.1.4/liblua32.a
            lua-5.1.4/liblua64.a
            lua-5.1.4/lua32.exe
            lua-5.1.4/lua64.exe
            lua-5.1.4/luac32.exe
            lua-5.1.4/luac64.exe
