name: Build Lua 5.1.4 Core 32-bit with Separate DLLs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        update: true
        install: >-
          mingw-w64-i686-gcc
          make
          wget
          tar
          zip

    - name: Download Lua 5.1.4
      shell: msys2 {0}
      run: |
        wget http://www.lua.org/ftp/lua-5.1.4.tar.gz
        tar -xzf lua-5.1.4.tar.gz

    - name: Fix luaconf.h for Windows
      shell: msys2 {0}
      working-directory: lua-5.1.4/src
      run: |
        sed -i 's/_longjmp/longjmp/g' luaconf.h
        sed -i 's/_setjmp/setjmp/g' luaconf.h

    - name: Create print.c for luac
      shell: msys2 {0}
      working-directory: lua-5.1.4/src
      run: |
        cat > print.c << 'EOF'
        #include <stdio.h>
        #include <ctype.h>
        #include "ldebug.h"
        #include "lobject.h"
        #include "lopcodes.h"
        #include "lundump.h"
        
        #define VOID(p) ((void*)(p))
        
        static void PrintString(const TString* ts)
        {
         const char* s=getstr(ts);
         size_t i,n=ts->tsv.len;
         putchar('"');
         for (i=0;i<n;i++)
         {
          int c=s[i];
          switch (c)
          {
           case '"': printf("\\\""); break;
           case '\\': printf("\\\\"); break;
           case '\n': printf("\\n"); break;
           case '\r': printf("\\r"); break;
           case '\t': printf("\\t"); break;
           default:
            if (isprint((unsigned char)c)) putchar(c);
            else printf("\\%03u",(unsigned char)c);
          }
         }
         putchar('"');
        }
        
        static void PrintConstant(const Proto* f, int i)
        {
         const TValue* o=&f->k[i];
         switch (ttype(o))
         {
          case LUA_TNIL: printf("nil"); break;
          case LUA_TBOOLEAN: printf(bvalue(o) ? "true" : "false"); break;
          case LUA_TNUMBER: printf(LUA_NUMBER_FMT,nvalue(o)); break;
          case LUA_TSTRING: PrintString(rawtsvalue(o)); break;
          default: printf("? type=%d",ttype(o)); break;
         }
        }
        
        static void PrintCode(const Proto* f)
        {
         const Instruction* code=f->code;
         int pc,n=f->sizecode;
         for (pc=0; pc<n; pc++)
         {
          Instruction i=code[pc];
          OpCode o=GET_OPCODE(i);
          int a=GETARG_A(i);
          int b=GETARG_B(i);
          int c=GETARG_C(i);
          int bx=GETARG_Bx(i);
          int sbx=GETARG_sBx(i);
          int line=getline(f,pc);
          printf("\t%d\t",pc+1);
          if (line>0) printf("[%d]\t",line); else printf("[-]\t");
          printf("%-9s\t",luaP_opnames[o]);
          switch (getOpMode(o))
          {
           case iABC: printf("%d",a); if (getBMode(o)!=OpArgN) printf(" %d",ISK(b)?(-1-INDEXK(b)):b); if (getCMode(o)!=OpArgN) printf(" %d",ISK(c)?(-1-INDEXK(c)):c); break;
           case iABx: if (getBMode(o)==OpArgK) printf("%d %d",a,-1-bx); else printf("%d %d",a,bx); break;
           case iAsBx: if (o==OP_JMP) printf("%d",sbx); else printf("%d %d",a,sbx); break;
          }
          switch (o)
          {
           case OP_LOADK: printf("\t; "); PrintConstant(f,bx); break;
           case OP_GETGLOBAL:
           case OP_SETGLOBAL: printf("\t; %s",svalue(&f->k[bx])); break;
           case OP_GETTABLE:
           case OP_SELF: if (ISK(c)) { printf("\t; "); PrintConstant(f,INDEXK(c)); } break;
           case OP_JMP:
           case OP_FORLOOP:
           case OP_FORPREP: printf("\t; to %d",sbx+pc+2); break;
           default: break;
          }
          printf("\n");
         }
        }
        
        static void PrintHeader(const Proto* f)
        {
         const char* s=getstr(f->source);
         if (*s=='@' || *s=='=') s++;
         else if (*s==LUA_SIGNATURE[0]) s="(bstring)";
         else s="(string)";
         printf("\n%s <%s:%d,%d> (%d instructions at %p)\n",
          (f->linedefined==0)?"main":"function",s,
          f->linedefined,f->lastlinedefined,f->sizecode,VOID(f));
         printf("%d%s params, %d slots, %d upvalues, ",
          f->numparams,f->is_vararg?"+":"",f->maxstacksize,f->nups);
         printf("%d locals, %d constants, %d functions\n",
          f->sizelocvars,f->sizek,f->sizep);
        }
        
        void luaU_print(const Proto* f, int full)
        {
         int i,n=f->sizep;
         PrintHeader(f);
         PrintCode(f);
         if (full)
         {
          for (i=0; i<n; i++) luaU_print(f->p[i],full);
         }
        }
        EOF

    - name: Build Lua core and libraries
      shell: msys2 {0}
      working-directory: lua-5.1.4/src
      run: |
        # 编译核心对象文件
        gcc -m32 -O2 -c -o lapi.o lapi.c
        gcc -m32 -O2 -c -o lcode.o lcode.c
        gcc -m32 -O2 -c -o ldebug.o ldebug.c
        gcc -m32 -O2 -c -o ldo.o ldo.c
        gcc -m32 -O2 -c -o ldump.o ldump.c
        gcc -m32 -O2 -c -o lfunc.o lfunc.c
        gcc -m32 -O2 -c -o lgc.o lgc.c
        gcc -m32 -O2 -c -o llex.o llex.c
        gcc -m32 -O2 -c -o lmem.o lmem.c
        gcc -m32 -O2 -c -o lobject.o lobject.c
        gcc -m32 -O2 -c -o lopcodes.o lopcodes.c
        gcc -m32 -O2 -c -o lparser.o lparser.c
        gcc -m32 -O2 -c -o lstate.o lstate.c
        gcc -m32 -O2 -c -o lstring.o lstring.c
        gcc -m32 -O2 -c -o ltable.o ltable.c
        gcc -m32 -O2 -c -o ltm.o ltm.c
        gcc -m32 -O2 -c -o lundump.o lundump.c
        gcc -m32 -O2 -c -o lvm.o lvm.c
        gcc -m32 -O2 -c -o lzio.o lzio.c
        
        # 编译 lauxlib（包含 luaL_* 函数）
        gcc -m32 -O2 -c -o lauxlib.o lauxlib.c
        
        # 创建核心库（所有核心对象 + lauxlib 打包成一个 dll）
        gcc -m32 -O2 -shared -o lua51.dll lapi.o lcode.o ldebug.o ldo.o ldump.o lfunc.o lgc.o llex.o lmem.o lobject.o lopcodes.o lparser.o lstate.o lstring.o ltable.o ltm.o lundump.o lvm.o lzio.o lauxlib.o -lm
        
        # 编译 lua.exe（链接核心 dll）
        gcc -m32 -O2 -c -o lua.o lua.c
        gcc -m32 -O2 -o lua.exe lua.o -L. -llua51 -lm
        
        # 编译 luac.exe
        gcc -m32 -O2 -c -o print.o print.c
        gcc -m32 -O2 -c -o luac.o luac.c
        gcc -m32 -O2 -o luac.exe luac.o print.o -L. -llua51 -lm
        
        # 编译基础库（print 等）
        gcc -m32 -O2 -c -o lbaselib.o lbaselib.c
        gcc -m32 -O2 -shared -o base.dll lbaselib.o -L. -llua51
        
        # 编译 package 库（require 功能）
        gcc -m32 -O2 -c -o loadlib.o loadlib.c
        gcc -m32 -O2 -shared -o package.dll loadlib.o -L. -llua51
        
        # 编译 string 库
        gcc -m32 -O2 -c -o lstrlib.o lstrlib.c
        gcc -m32 -O2 -shared -o string.dll lstrlib.o -L. -llua51
        
        # 编译 math 库
        gcc -m32 -O2 -c -o lmathlib.o lmathlib.c
        gcc -m32 -O2 -shared -o math.dll lmathlib.o -L. -llua51
        
        # 编译 table 库
        gcc -m32 -O2 -c -o ltablib.o ltablib.c
        gcc -m32 -O2 -shared -o table.dll ltablib.o -L. -llua51
        
        # 编译 io 库
        gcc -m32 -O2 -c -o liolib.o liolib.c
        gcc -m32 -O2 -shared -o io.dll liolib.o -L. -llua51
        
        # 编译 os 库
        gcc -m32 -O2 -c -o loslib.o loslib.c
        gcc -m32 -O2 -shared -o os.dll loslib.o -L. -llua51
        
        # 编译 debug 库
        gcc -m32 -O2 -c -o ldblib.o ldblib.c
        gcc -m32 -O2 -shared -o debug.dll ldblib.o -L. -llua51

    - name: Create release zip
      shell: msys2 {0}
      working-directory: lua-5.1.4
      run: |
        mkdir -p lua-core
        cp src/lua.exe lua-core/
        cp src/luac.exe lua-core/
        cp src/lua51.dll lua-core/
        cp src/base.dll lua-core/
        cp src/package.dll lua-core/
        cp src/string.dll lua-core/
        cp src/math.dll lua-core/
        cp src/table.dll lua-core/
        cp src/io.dll lua-core/
        cp src/os.dll lua-core/
        cp src/debug.dll lua-core/
        cd lua-core
        zip -r ../lua-core-32bit.zip .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lua-core-32bit
        path: lua-5.1.4/lua-core-32bit.zip
